{{ if not .Site.Params.hideColorSchemeToggle }}
<div class="float-container">
    <a id="dark-mode-toggle" class="colorscheme-toggle" role="button" tabindex="0" aria-label="밝은 화면/어두운 화면 전환">
        <i class="fa-solid fa-adjust fa-fw" aria-hidden="true"></i>
    </a>
</div>
<script>
  // 테마의 클릭 동작을 Enter·Space 키로도 실행한다.
  document.getElementById('dark-mode-toggle').addEventListener('keydown', function (event) {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      this.click();
    }
  });
</script>
{{ end }}
